name: CLA Assistant

# Checks that every pull request author has signed the CLA (CLA.md).
# Signatures are stored in signatures/cla.json on the cla-signatures branch.
# If GitHub Actions is unavailable, the manual path in CONTRIBUTING.md applies.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/romulorgc/tomada/blob/main/CLA.md
          branch: cla-signatures
          allowlist: romulorgc,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before I can review it, please read the
            [CLA](https://github.com/romulorgc/tomada/blob/main/CLA.md) and sign it by
            posting the sentence below as a comment on this pull request.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
